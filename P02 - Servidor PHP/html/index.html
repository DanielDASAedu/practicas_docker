<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de inscripción</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="contenedor">

        <h1>Inscripción del alumnado</h1>

        <p class="descripcion">
            Introduce tus datos académicos:
        </p>

        <form action="procesar.php" method="POST">

            <div class="grupo">
                <label for="nombre">Nombre y apellidos:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="grupo">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>
            </div>





            <div class="grupo">
                <label>Ciclo formativo:</label>

                <div class="seleccion-ciclo">
                    <label class="opcion-ciclo">
                        <input type="radio" name="curso" value="ASIR" required>
                        ASIR
                    </label>

                    <label class="opcion-ciclo">
                        <input type="radio" name="curso" value="DAM">
                        DAM
                    </label>

                    <label class="opcion-ciclo">
                        <input type="radio" name="curso" value="DAW">
                        DAW
                    </label>
                </div>
            </div>

            <div class="grupo">
                <label for="nivel">Curso:</label>
                <select id="nivel" name="nivel" required>
                    <option value="">Selecciona el curso</option>
                    <option value="1">Primero</option>
                    <option value="2">Segundo</option>
                </select>
            </div>



            <div class="grupo"></div>
            <label>Turno:</label>

            <div class="seleccion-turno">
                <label class="opcion-turno">
                    <input type="radio" name="turno" value="1" required>
                    Mañana
                </label>

                <label class="opcion-turno">
                    <input type="radio" name="turno" value="2">
                    Tarde
                </label>
            </div>
            <br>

            <div class="grupo">
                <label for="actividades">Elige una actividad:</label>
                <select name="actividades" id="actividades" required>
                    <option value="">Elige actividad </option>
                    <option value="RB">Robótica</option>
                    <option value="DV">Desarrollo de videojuegos</option>
                    <option value="CS">Ciberseguridad</option>
                    <option value="DI">Diseño e impresión 3D</option>
                </select>
            </div>

            <div class="opciones">

                <p class="titulo-opciones">
                    Recursos para las prácticas:
                </p>

                <label class="opcion" for="portatil">
                    <input type="checkbox" id="portatil" name="portatil" value="true">
                    Dispongo de ordenador portátil propio.
                </label>

                <label class="opcion" for="auriculares">
                    <input type="checkbox" id="auriculares" name="auriculares" value="true">
                    Dispongo de auriculares propios.
                </label>

                <label class="opcion" for="escritura">
                    <input type="checkbox" id="escritura" name="escritura" value="true">
                    Dispongo de material de escritura propio.
                </label>



            </div>

            <div class="grupo">
                <label for="observacion">Observaciones: </label>

                <textarea id="observacion" name="observacion" rows="4" cols="50"
                    placeholder="Introduzca alguna observación">
</textarea>
            </div>

            <div class="botones">
                <button type="submit" class="enviar">
                    Enviar formulario
                </button>

                <button type="reset" class="limpiar">
                    Limpiar
                </button>
            </div>

        </form>

        <p class="nota">
            Los datos introducidos se enviarán al servidor mediante
            el método POST.
        </p>

    </div>

</body>

</html>
